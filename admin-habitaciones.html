<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="https://yagock.github.io/prog_web/styles-admin.css">
    <title>Hotel Quinta Dalam | Administración de Habitaciones</title>
</head>
    <body>
            <div class="contenedor">

            <h1>Hotel Quinta Dalam</h1>
            <h2>Administración de Habitaciones</h2>
            <form>
                <label>Nombre de la habitación</label>
                <input type="text">
                <label>Descripción</label>
                <textarea rows="4"></textarea>
                <h3>Servicios</h3>
                <div class="servicios">
                    <label><input type="checkbox"> WiFi</label>
                    <label><input type="checkbox"> Cama King Size</label>
                    <label><input type="checkbox"> Vista al jardín</label>
                    <label><input type="checkbox"> Aire acondicionado</label>
                </div>
                <div class="botones">
                    <button type="submit">Guardar</button>
                    <button type="button">Actualizar</button>
                    <button type="button">Eliminar</button>
                </div>
            </form>
        </div>
        <p>
            <a href="https://jigsaw.w3.org/css-validator/check/referer">
                <img style="border:0;width:88px;height:31px"
                    src="https://jigsaw.w3.org/css-validator/images/vcss"
                    alt="¡CSS Válido!" />
            </a>
        </p>
    </body>
</html>
